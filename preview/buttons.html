<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 32px; background: var(--bg-canvas); min-height: 100vh; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .btn { font-family: var(--font-sans); font-size: 14px; font-weight: 500; padding: 10px 18px; border-radius: var(--radius-md); border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 120ms cubic-bezier(0.2,0.7,0.2,1); }
  .btn-primary { background: var(--amber-400); color: var(--plum-900); box-shadow: var(--shadow-1); }
  .btn-secondary { background: var(--bg-elevated); color: var(--fg-1); border: 1px solid var(--border-soft); }
  .btn-ghost { background: transparent; color: var(--fg-2); }
  .btn-danger { background: transparent; color: var(--red-400); border: 1px solid rgba(240,107,107,0.3); }
  .btn .arrow { font-size: 14px; }
  .btn-sm { font-size: 13px; padding: 7px 12px; }
  .btn-lg { font-size: 16px; padding: 14px 24px; }
  .row { display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
  <div class="row">
    <button class="btn btn-primary">Render lesson <span class="arrow">→</span></button>
    <button class="btn btn-secondary">Save draft</button>
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-danger">Discard</button>
  </div>
  <div class="row">
    <button class="btn btn-primary btn-sm">Send</button>
    <button class="btn btn-primary btn-lg">Start a lesson</button>
    <button class="btn btn-secondary btn-sm">+ Add scene</button>
  </div>
</body>
</html>

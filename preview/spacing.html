<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg-canvas); min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--fg-2); font-family: var(--font-mono); }
  .row .name { width: 80px; color: var(--fg-3); }
  .bar { height: 14px; background: linear-gradient(90deg, var(--amber-400), var(--rose-400)); border-radius: 3px; }
  .px { color: var(--fg-3); }
</style>
</head>
<body>
  <div class="row"><span class="name">space-1</span><span class="bar" style="width:4px"></span><span class="px">4 px</span></div>
  <div class="row"><span class="name">space-2</span><span class="bar" style="width:8px"></span><span class="px">8 px</span></div>
  <div class="row"><span class="name">space-3</span><span class="bar" style="width:12px"></span><span class="px">12 px</span></div>
  <div class="row"><span class="name">space-4</span><span class="bar" style="width:16px"></span><span class="px">16 px</span></div>
  <div class="row"><span class="name">space-5</span><span class="bar" style="width:24px"></span><span class="px">24 px</span></div>
  <div class="row"><span class="name">space-6</span><span class="bar" style="width:32px"></span><span class="px">32 px</span></div>
  <div class="row"><span class="name">space-7</span><span class="bar" style="width:48px"></span><span class="px">48 px</span></div>
  <div class="row"><span class="name">space-8</span><span class="bar" style="width:64px"></span><span class="px">64 px</span></div>
  <div class="row"><span class="name">space-9</span><span class="bar" style="width:96px"></span><span class="px">96 px</span></div>
</body>
</html>

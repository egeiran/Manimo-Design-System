<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg-canvas); min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; max-width: 520px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  input, textarea { font-family: var(--font-sans); font-size: 14px; color: var(--fg-1); background: var(--bg-elevated); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 10px 14px; outline: none; transition: border-color 120ms; }
  input:focus, textarea:focus { border-color: var(--amber-400); box-shadow: 0 0 0 3px rgba(244,184,96,0.15); }
  input::placeholder { color: var(--fg-4); }
  .focused { border-color: var(--amber-400) !important; box-shadow: 0 0 0 3px rgba(244,184,96,0.15); }
</style>
</head>
<body>
  <div class="field"><label>Lesson title</label><input value="Why a hoop rolls slower than a disk" /></div>
  <div class="field"><label>Topic</label><input class="focused" placeholder="Type to search…" value="rotational"/></div>
  <div class="field"><label>Disabled</label><input disabled value="Locked while rendering" style="opacity:0.5"/></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--bg-canvas); min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; gap: 20px; justify-content: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 84px; height: 84px; background: var(--bg-elevated); border: 1px solid var(--border-soft); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .val { font-size: 12px; color: var(--fg-2); font-weight: 600; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">radius-sm</div><div class="val">6 px</div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">radius-md</div><div class="val">10 px</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="name">radius-lg</div><div class="val">16 px</div></div>
  <div class="item"><div class="box" style="border-radius:24px"></div><div class="name">radius-xl</div><div class="val">24 px</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">radius-pill</div><div class="val">full</div></div>
</body>
</html>

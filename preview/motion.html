<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Motion</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg-canvas); min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 12px; color: var(--fg-3); }
  .row .name { width: 110px; color: var(--fg-2); }
  .track { flex: 1; height: 24px; position: relative; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden; }
  .ball { position: absolute; top: 4px; left: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--amber-400); }
  .b-draw { animation: m 1800ms cubic-bezier(0.32, 0.72, 0.0, 1.0) infinite; }
  .b-out  { animation: m 1800ms cubic-bezier(0.2, 0.7, 0.2, 1.0) infinite; }
  .b-in   { animation: m 1800ms cubic-bezier(0.6, 0.0, 0.8, 0.4) infinite; }
  @keyframes m { 0%{left:4px} 50%{left:calc(100% - 20px)} 100%{left:4px} }
  .dur { color: var(--fg-3); width: 80px; text-align: right; }
</style>
</head>
<body>
  <div class="row"><span class="name">ease-draw</span><div class="track"><div class="ball b-draw"></div></div><span class="dur">800ms</span></div>
  <div class="row"><span class="name">ease-out</span><div class="track"><div class="ball b-out"></div></div><span class="dur">240ms</span></div>
  <div class="row"><span class="name">ease-in</span><div class="track"><div class="ball b-in"></div></div><span class="dur">120ms</span></div>
  <div class="row" style="margin-top:6px;color:var(--fg-4)"><span class="name"></span>Default is <span style="color:var(--amber-300)">ease-draw</span> · 240ms · no bounces</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Type — Body &amp; UI</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg-canvas); min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 18px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 130px; flex-shrink: 0; }
  .lead { font-size: 20px; color: var(--fg-1); line-height: 1.45; }
  .body { font-size: 17px; color: var(--fg-2); line-height: 1.6; max-width: 540px; }
  .ui { font-size: 14px; color: var(--fg-2); }
  .label { font-size: 13px; color: var(--fg-3); }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); font-weight: 600; }
</style>
</head>
<body>
  <div class="row"><span class="meta">Lead 20</span><span class="lead">A friendly companion that turns a script into a finished lesson.</span></div>
  <div class="row"><span class="meta">Body 17 / 1.6</span><span class="body">Imagine you're standing at the origin of a coordinate plane. The function we want to understand is simple — it takes a number and squares it.</span></div>
  <div class="row"><span class="meta">UI 14 / 1.4</span><span class="ui">Render lesson</span></div>
  <div class="row"><span class="meta">Label 13</span><span class="label">Scene 3 of 7</span></div>
  <div class="row"><span class="meta">Eyebrow 12</span><span class="eyebrow">Now playing</span></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg-canvas); display: flex; align-items: center; gap: 40px; min-height: 100vh; box-sizing: border-box; }
  .lockup { display: flex; align-items: center; gap: 16px; }
  .lockup .mark { width: 56px; height: 56px; }
  .lockup .word { font-family: var(--font-serif); font-size: 44px; color: var(--fg-1); font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
  .alt { display: flex; align-items: center; justify-content: center; width: 96px; height: 96px; background: var(--bg-elevated); border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); }
  .alt img { width: 56px; height: 56px; }
  .label { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 10px; text-align: center; }
  .grp { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <div class="grp">
    <div class="lockup">
      <img class="mark" src="../assets/manimo-mark.svg"/>
      <div class="word">Manimo</div>
    </div>
    <div class="label">Primary lockup</div>
  </div>
  <div class="grp">
    <div class="alt"><img src="../assets/manimo-mark.svg"/></div>
    <div class="label">Mark only</div>
  </div>
</body>
</html>

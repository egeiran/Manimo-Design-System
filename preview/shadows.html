<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 36px 24px; background: var(--bg-canvas); min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; gap: 28px; justify-content: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 110px; height: 80px; background: var(--bg-elevated); border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .val { font-size: 11px; color: var(--fg-4); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-1)"></div><div class="name">shadow-1</div><div class="val">resting</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-2)"></div><div class="name">shadow-2</div><div class="val">hover</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-3)"></div><div class="name">shadow-3</div><div class="val">popover</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-4)"></div><div class="name">shadow-4</div><div class="val">modal</div></div>
</body>
</html>

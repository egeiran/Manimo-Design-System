<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Manimo — Scenes</title>
<link rel="icon" href="assets/manimo-mark.svg"/>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
  body {
    margin: 0;
    background: var(--bg-canvas);
    color: var(--fg-1);
    font-family: var(--font-sans);
    min-height: 100vh;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 64px 32px 96px;
  }
  header { margin-bottom: 40px; }
  h1 {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    font-size: 56px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    color: var(--chalk-50);
  }
  .lede {
    color: var(--fg-2);
    font-size: var(--text-md);
    line-height: 1.55;
    margin: 0;
    max-width: 56ch;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 14px;
  }
  section.subject { margin-bottom: 36px; }
  section.subject:last-of-type { margin-bottom: 0; }
  .subject-heading {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-3);
    margin: 0 0 14px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .subject-heading .count {
    color: var(--fg-4);
    font-size: 11px;
  }
  a.card {
    display: block;
    padding: 20px 24px;
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    background: var(--bg-elevated);
    color: inherit;
    text-decoration: none;
    transition: border-color 120ms ease, transform 120ms ease, background-color 120ms ease;
  }
  a.card:hover {
    border-color: var(--border-strong);
    background: var(--bg-raised);
    transform: translateY(-1px);
  }
  .eyebrow {
    font-family: var(--font-sans);
    font-size: var(--text-xs);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-3);
    margin: 0 0 6px;
  }
  .title {
    font-family: var(--font-serif);
    font-size: var(--text-xl);
    font-weight: 500;
    margin: 0 0 8px;
    color: var(--chalk-50);
    line-height: 1.2;
  }
  .meta {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    color: var(--fg-3);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lang {
    padding: 1px 7px;
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .empty, .err {
    color: var(--fg-3);
    font-size: var(--text-sm);
  }
  .err { color: var(--status-danger); }
  footer {
    margin-top: 56px;
    color: var(--fg-4);
    font-size: var(--text-xs);
  }
  footer a { color: var(--fg-3); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Manimo</h1>
    <p class="lede">
      Chalkboard-style physics scenes — narrated, animated, rendered live in
      your browser. Each scene is self-contained HTML.
    </p>
  </header>
  <div id="scenes" aria-busy="true"><p class="empty">Loading scenes…</p></div>
  <footer>
    Brand and motion library: <a href="ui_kits/studio/">studio</a> ·
    <a href="preview/">design system preview</a>
  </footer>
</main>
<script>
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
  function fmtDuration(s) {
    const m = Math.floor(s / 60);
    const sec = Math.round(s - m * 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }
  // Preferred display order — matches kort-forklart's subject ids.
  // Subjects not listed sort alphabetically after; unattached scenes go last.
  const SUBJECT_ORDER = ['fysikk', 'matematikk1', 'mat2b', 'statistikk', 'algoritmer', 'ade', 'operativsystemer'];
  const UNATTACHED = '__unattached__';

  function sceneCard(s) {
    const path = s.subject_id
      ? `motion/${s.subject_id}/${s.html}`
      : `motion/${s.html}`;
    return `
      <li>
        <a class="card" href="${escapeHtml(path)}">
          ${s.eyebrow ? `<p class="eyebrow">${escapeHtml(s.eyebrow)}</p>` : ''}
          <h2 class="title">${escapeHtml(s.title)}</h2>
          <p class="meta">
            <span>${fmtDuration(s.duration)}</span>
            <span class="lang">${escapeHtml(s.language)}</span>
          </p>
        </a>
      </li>
    `;
  }

  function groupBySubject(scenes) {
    const groups = new Map();
    for (const s of scenes) {
      const key = s.subject_id || UNATTACHED;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    const keys = [...groups.keys()];
    keys.sort((a, b) => {
      if (a === UNATTACHED) return 1;
      if (b === UNATTACHED) return -1;
      const ai = SUBJECT_ORDER.indexOf(a);
      const bi = SUBJECT_ORDER.indexOf(b);
      if (ai !== -1 && bi !== -1) return ai - bi;
      if (ai !== -1) return -1;
      if (bi !== -1) return 1;
      return a.localeCompare(b);
    });
    return keys.map(k => [k, groups.get(k)]);
  }

  function subjectHeading(key, count) {
    const label = key === UNATTACHED ? 'sandbox' : key;
    return `<h2 class="subject-heading">${escapeHtml(label)} <span class="count">${count} scene${count === 1 ? '' : 's'}</span></h2>`;
  }

  fetch('motion/scene-manifest.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(({ scenes }) => {
      const root = document.getElementById('scenes');
      if (!scenes || scenes.length === 0) {
        root.innerHTML = '<p class="empty">No scenes published yet.</p>';
        return;
      }
      const sections = groupBySubject(scenes).map(([key, list]) => `
        <section class="subject">
          ${subjectHeading(key, list.length)}
          <ul>${list.map(sceneCard).join('')}</ul>
        </section>
      `).join('');
      root.innerHTML = sections;
      root.removeAttribute('aria-busy');
    })
    .catch(err => {
      document.getElementById('scenes').innerHTML =
        '<p class="err">Failed to load scene manifest: ' + escapeHtml(err.message) + '</p>';
    });
</script>
</body>
</html>

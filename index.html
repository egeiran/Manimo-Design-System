<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Manimo — Scenes</title>
<link rel="icon" href="assets/manimo-mark.svg"/>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
  body {
    margin: 0;
    background: var(--bg-canvas);
    color: var(--fg-1);
    font-family: var(--font-sans);
    min-height: 100vh;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 64px 32px 96px;
  }
  header { margin-bottom: 40px; }
  h1 {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    font-size: 56px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    color: var(--chalk-50);
  }
  .lede {
    color: var(--fg-2);
    font-size: var(--text-md);
    line-height: 1.55;
    margin: 0;
    max-width: 56ch;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 14px;
  }

  /* ── Subject grid (front page) ─────────────────────────────── */
  .subjects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  a.subject-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 24px 26px 22px;
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    background: var(--bg-elevated);
    color: inherit;
    text-decoration: none;
    transition: border-color 120ms ease, transform 120ms ease, background-color 120ms ease;
    min-height: 140px;
  }
  a.subject-card:hover {
    border-color: var(--border-strong);
    background: var(--bg-raised);
    transform: translateY(-1px);
  }
  .subject-card .code {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-3);
  }
  .subject-card .name {
    font-family: var(--font-serif);
    font-size: var(--text-xl);
    font-weight: 500;
    color: var(--chalk-50);
    line-height: 1.2;
    margin: 0;
  }
  .subject-card .stats {
    margin-top: auto;
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    color: var(--fg-3);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .subject-card .stats .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--fg-4);
    display: inline-block;
  }

  /* ── Subject detail (chapter view) ─────────────────────────── */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-3);
    text-decoration: none;
    margin-bottom: 20px;
  }
  .back-link:hover { color: var(--chalk-50); }
  .subject-header {
    margin-bottom: 36px;
  }
  .subject-header .code {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-3);
    margin: 0 0 8px;
  }
  .subject-header h1 {
    font-size: 44px;
    margin: 0 0 8px;
  }
  .subject-header .summary {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    color: var(--fg-3);
    margin: 0;
  }

  section.chapter { margin-bottom: 32px; }
  section.chapter:last-of-type { margin-bottom: 0; }
  .chapter-heading {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-3);
    margin: 0 0 14px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .chapter-heading .count {
    color: var(--fg-4);
    font-size: 11px;
  }

  a.card {
    display: block;
    padding: 20px 24px;
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    background: var(--bg-elevated);
    color: inherit;
    text-decoration: none;
    transition: border-color 120ms ease, transform 120ms ease, background-color 120ms ease;
  }
  a.card:hover {
    border-color: var(--border-strong);
    background: var(--bg-raised);
    transform: translateY(-1px);
  }
  .eyebrow {
    font-family: var(--font-sans);
    font-size: var(--text-xs);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-3);
    margin: 0 0 6px;
  }
  .title {
    font-family: var(--font-serif);
    font-size: var(--text-xl);
    font-weight: 500;
    margin: 0 0 8px;
    color: var(--chalk-50);
    line-height: 1.2;
  }
  .meta {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    color: var(--fg-3);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lang {
    padding: 1px 7px;
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .empty, .err {
    color: var(--fg-3);
    font-size: var(--text-sm);
  }
  .err { color: var(--status-danger); }
  footer {
    margin-top: 56px;
    color: var(--fg-4);
    font-size: var(--text-xs);
  }
  footer a { color: var(--fg-3); }
</style>
</head>
<body>
<main>
  <div id="root" aria-busy="true"><p class="empty">Loading scenes…</p></div>
  <footer>
    Brand and motion library: <a href="ui_kits/studio/">studio</a> ·
    <a href="preview/">design system preview</a>
  </footer>
</main>
<script>
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
  function fmtDuration(s) {
    const m = Math.floor(s / 60);
    const sec = Math.round(s - m * 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  // Subject display metadata. Keys are subject_id values from the manifest;
  // anything not listed here falls back to id-as-name and no course code.
  // Order here is the order subjects appear on the front page.
  const SUBJECTS = [
    { id: 'fysikk',           code: 'TFY4125',  name: 'Fysikk' },
    { id: 'mat2b',            code: 'Mat2B',    name: 'Matematikk 2' },
    { id: 'ade',              code: 'TTT4203',  name: 'Analog og digital elektronikk' },
    { id: 'operativsystemer', code: '',         name: 'Operativsystemer' },
  ];
  const UNATTACHED = '__unattached__';

  function subjectMeta(id) {
    if (id === UNATTACHED) return { id, code: '', name: 'Sandbox' };
    const known = SUBJECTS.find(s => s.id === id);
    if (known) return known;
    return { id, code: '', name: id };
  }

  function groupBySubject(scenes) {
    const groups = new Map();
    for (const s of scenes) {
      const key = s.subject_id || UNATTACHED;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    // Sort: known subjects in SUBJECTS order, then unknowns alpha, then sandbox.
    const order = SUBJECTS.map(s => s.id);
    const keys = [...groups.keys()].sort((a, b) => {
      if (a === UNATTACHED) return 1;
      if (b === UNATTACHED) return -1;
      const ai = order.indexOf(a);
      const bi = order.indexOf(b);
      if (ai !== -1 && bi !== -1) return ai - bi;
      if (ai !== -1) return -1;
      if (bi !== -1) return 1;
      return a.localeCompare(b);
    });
    return keys.map(k => [k, groups.get(k)]);
  }

  function chapterSpan(scenes) {
    const nums = scenes.map(s => s.chapter_number).filter(n => Number.isInteger(n));
    if (nums.length === 0) return null;
    const lo = Math.min(...nums);
    const hi = Math.max(...nums);
    return lo === hi ? `ch. ${lo}` : `ch. ${lo}–${hi}`;
  }

  // ── Views ────────────────────────────────────────────────────
  function renderSubjectGrid(scenes) {
    const groups = groupBySubject(scenes);
    const cards = groups.map(([key, list]) => {
      const meta = subjectMeta(key);
      const span = chapterSpan(list);
      const stats = [
        `${list.length} scene${list.length === 1 ? '' : 's'}`,
        span,
      ].filter(Boolean);
      return `
        <li>
          <a class="subject-card" href="#${encodeURIComponent(key)}">
            ${meta.code ? `<p class="code">${escapeHtml(meta.code)}</p>` : '<p class="code">&nbsp;</p>'}
            <h2 class="name">${escapeHtml(meta.name)}</h2>
            <p class="stats">${stats.map(escapeHtml).join(' <span class="dot"></span> ')}</p>
          </a>
        </li>
      `;
    }).join('');

    return `
      <header>
        <h1>Manimo</h1>
        <p class="lede">
          Chalkboard-style scenes — narrated, animated, rendered live in your
          browser. Pick a subject to browse by chapter.
        </p>
      </header>
      <ul class="subjects-grid">${cards}</ul>
    `;
  }

  function sceneCard(s) {
    const subj = s.subject_id;
    const path = subj
      ? `motion/${subj}/${s.html}`
      : `motion/${s.html}`;
    return `
      <li>
        <a class="card" href="${escapeHtml(path)}">
          ${s.eyebrow ? `<p class="eyebrow">${escapeHtml(s.eyebrow)}</p>` : ''}
          <h2 class="title">${escapeHtml(s.title)}</h2>
          <p class="meta">
            <span>${fmtDuration(s.duration)}</span>
            <span class="lang">${escapeHtml(s.language)}</span>
          </p>
        </a>
      </li>
    `;
  }

  function renderSubjectDetail(subjectId, scenes) {
    const meta = subjectMeta(subjectId);
    const ofSubject = scenes.filter(s => (s.subject_id || UNATTACHED) === subjectId);

    if (ofSubject.length === 0) {
      return `
        <a class="back-link" href="#">← All subjects</a>
        <header class="subject-header">
          <p class="code">${escapeHtml(meta.code || meta.id)}</p>
          <h1>${escapeHtml(meta.name)}</h1>
        </header>
        <p class="empty">No scenes for this subject yet.</p>
      `;
    }

    // Group by chapter_number; null/undefined chapters bucket together at end.
    const chapters = new Map();
    for (const s of ofSubject) {
      const ch = Number.isInteger(s.chapter_number) ? s.chapter_number : null;
      if (!chapters.has(ch)) chapters.set(ch, []);
      chapters.get(ch).push(s);
    }
    const chapterKeys = [...chapters.keys()].sort((a, b) => {
      if (a === null) return 1;
      if (b === null) return -1;
      return a - b;
    });

    // Sort scenes within a chapter by title for stable display.
    for (const list of chapters.values()) {
      list.sort((a, b) => a.title.localeCompare(b.title));
    }

    const totalSec = ofSubject.reduce((acc, s) => acc + (s.duration || 0), 0);
    const totalMin = Math.round(totalSec / 60);
    const span = chapterSpan(ofSubject);
    const summaryBits = [
      `${ofSubject.length} scene${ofSubject.length === 1 ? '' : 's'}`,
      span,
      `${totalMin} min total`,
    ].filter(Boolean).join(' · ');

    const sections = chapterKeys.map(ch => {
      const label = ch === null ? 'Unassigned' : `Chapter ${ch}`;
      const list = chapters.get(ch);
      return `
        <section class="chapter">
          <h2 class="chapter-heading">
            ${escapeHtml(label)}
            <span class="count">${list.length} scene${list.length === 1 ? '' : 's'}</span>
          </h2>
          <ul>${list.map(sceneCard).join('')}</ul>
        </section>
      `;
    }).join('');

    return `
      <a class="back-link" href="#">← All subjects</a>
      <header class="subject-header">
        <p class="code">${escapeHtml(meta.code || meta.id)}</p>
        <h1>${escapeHtml(meta.name)}</h1>
        <p class="summary">${escapeHtml(summaryBits)}</p>
      </header>
      ${sections}
    `;
  }

  // ── Routing ──────────────────────────────────────────────────
  let SCENES = null;

  function currentSubject() {
    const h = window.location.hash.replace(/^#/, '');
    if (!h) return null;
    try { return decodeURIComponent(h); } catch { return h; }
  }

  function render() {
    const root = document.getElementById('root');
    if (!SCENES) return;
    const subj = currentSubject();
    root.innerHTML = subj
      ? renderSubjectDetail(subj, SCENES)
      : renderSubjectGrid(SCENES);
    root.removeAttribute('aria-busy');
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);

  fetch('motion/scene-manifest.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(({ scenes }) => {
      SCENES = scenes || [];
      if (SCENES.length === 0) {
        document.getElementById('root').innerHTML =
          '<p class="empty">No scenes published yet.</p>';
        return;
      }
      render();
    })
    .catch(err => {
      document.getElementById('root').innerHTML =
        '<p class="err">Failed to load scene manifest: ' + escapeHtml(err.message) + '</p>';
    });
</script>
</body>
</html>
